name: Booska live archive
on:
  schedule:
    - cron: "*/10 * * * *"   # every 10 minutes (GitHub may delay a few minutes)
  workflow_dispatch: {}       # "Run workflow" button
permissions:
  contents: write
concurrency:
  group: booska-archive
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Update data (never deletes)
        run: node scripts/update.mjs
      - name: Save to the repository
        run: |
          git config user.name "booska-bot"
          git config user.email "booska-bot@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then echo "nothing new"; exit 0; fi
          git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)"
          git pull --rebase --quiet
          git push
